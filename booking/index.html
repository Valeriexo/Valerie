<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090d">
  <title>8S.MELANCHOLY — Booking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <!-- Header styled like the reference screenshot -->
  <header class="header">
    <div class="logo">8S.MELANCHOLY</div>

    <button class="hamburger" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- The photo begins behind the booking form -->
  <section class="hero">
    <div class="photo"></div>
    <div class="photo-dark"></div>

    <div class="booking">
      <h1>BOOKING</h1>

      <form action="mailto:YOUR-EMAIL@example.com" method="post" enctype="text/plain">

        <div class="field">
          <label for="name">Your name <b>*</b></label>
          <input id="name" name="Name" type="text" required>
        </div>

        <div class="field">
          <label for="email">Your email <b>*</b></label>
          <input id="email" name="Email" type="email" required>
        </div>

        <div class="field">
          <label for="message">Your message <b>*</b></label>
          <textarea id="message" name="Message" rows="1" required></textarea>
        </div>

        <div class="field">
          <label for="budget">Your budget <b>*</b></label>
          <input id="budget" name="Budget" type="text" required>
        </div>

        <div class="field">
          <label for="extra">Anything else you'd like me to know?</label>
          <textarea id="extra" name="Anything else" rows="1"></textarea>
        </div>

        <div class="field">
          <label for="instagram">Instagram Handle</label>
          <input id="instagram" name="Instagram Handle" type="text" placeholder="@">
        </div>

        <button class="send" type="submit">Send</button>
      </form>
    </div>
  </section>

  <footer>ALL RIGHTS RESERVED · 8S.MELANCHOLY</footer>
</div>

</body>
</html>
