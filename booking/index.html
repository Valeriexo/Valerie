<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050609">
  <title>8S.MELANCHOLY — Booking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">

    <header class="header">
      <div class="logo">8S.MELANCHOLY</div>
      <button class="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </header>

    <main class="hero">
      <div class="photo"></div>

      <!-- Keeps text readable without making the whole photograph too dark -->
      <div class="readability"></div>

      <section class="booking">
        <h1>BOOKING</h1>

        <div class="tally-wrap">
          <iframe
            data-tally-src="https://tally.so/embed/Zj71dV?hideTitle=1&transparentBackground=1&dynamicHeight=1"
            loading="lazy"
            width="100%"
            height="1050"
            frameborder="0"
            marginheight="0"
            marginwidth="0"
            title="8S.MELANCHOLY — BOOKING">
          </iframe>
        </div>
      </section>
    </main>

    <footer>ALL RIGHTS RESERVED · 8S.MELANCHOLY</footer>
  </div>

  <script>
    var d=document,w="https://tally.so/widgets/embed.js",v=function(){
      "undefined"!=typeof Tally?Tally.loadEmbeds():d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach(function(e){e.src=e.dataset.tallySrc})
    };
    if("undefined"!=typeof Tally)v();
    else if(d.querySelector('script[src="'+w+'"]')==null){
      var s=d.createElement("script");s.src=w;s.onload=v;s.onerror=v;d.body.appendChild(s);
    }
  </script>
</body>
</html>
